<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="logoGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Container (48x48) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logoBgGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="2" y="2" width="44" height="44" rx="10" fill="none" stroke="url(#logoBrandGrad)" stroke-width="1" stroke-opacity="0.35" />

    <!-- Mini Table Grid Inside Mark -->
    <!-- CSV Badge Header -->
    <rect x="7" y="7" width="22" height="9" rx="4.5" fill="url(#logoBrandGrad)" />
    <text x="18" y="14" fill="#020617" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="6.5" text-anchor="middle">CSV</text>
    <circle cx="39" cy="11.5" r="2.5" fill="#10b981" />

    <!-- Row 1 -->
    <rect x="7" y="19" width="14" height="10" rx="2" fill="url(#logoGreenGrad)" />
    <rect x="24" y="19" width="17" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />

    <!-- Row 2 -->
    <rect x="7" y="32" width="14" height="9" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <rect x="24" y="32" width="17" height="9" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(68, 36)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#0f172a" letter-spacing="-0.02em">
      CSV <tspan fill="url(#logoBrandGrad)">Viewer</tspan>
    </text>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10.5" fill="#64748b" letter-spacing="0.04em">
      &amp; EDITOR ONLINE
    </text>
  </g>
</svg>
