<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- CSV Header Pill Badge -->
  <g transform="translate(76, 72)">
    <rect x="0" y="0" width="180" height="60" rx="30" fill="url(#primaryGrad)" />
    <text x="90" y="41" fill="#020617" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="1">CSV</text>
  </g>

  <!-- Active Status Indicator Dot -->
  <circle cx="416" cy="102" r="14" fill="#10b981" filter="url(#glow)" />
  <circle cx="416" cy="102" r="8" fill="#ecfdf5" />

  <!-- Table Grid Layout -->
  <!-- Header Row Cells -->
  <g transform="translate(76, 160)">
    <rect x="0" y="0" width="108" height="54" rx="10" fill="#334155" />
    <rect x="124" y="0" width="112" height="54" rx="10" fill="#334155" />
    <rect x="252" y="0" width="108" height="54" rx="10" fill="#334155" />

    <!-- Header Content Bars -->
    <rect x="18" y="21" width="72" height="12" rx="6" fill="#94a3b8" />
    <rect x="142" y="21" width="76" height="12" rx="6" fill="#94a3b8" />
    <rect x="270" y="21" width="72" height="12" rx="6" fill="#94a3b8" />
  </g>

  <!-- Row 1 Cells -->
  <g transform="translate(76, 230)">
    <!-- Cell 1 (Highlighted / Active cell) -->
    <rect x="0" y="0" width="108" height="64" rx="12" fill="url(#accentGrad)" />
    <rect x="16" y="26" width="76" height="12" rx="6" fill="#ffffff" />

    <!-- Cell 2 -->
    <rect x="124" y="0" width="112" height="64" rx="12" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="142" y="26" width="76" height="12" rx="6" fill="#64748b" />

    <!-- Cell 3 -->
    <rect x="252" y="0" width="108" height="64" rx="12" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="270" y="26" width="72" height="12" rx="6" fill="#64748b" />
  </g>

  <!-- Row 2 Cells -->
  <g transform="translate(76, 310)">
    <!-- Cell 1 -->
    <rect x="0" y="0" width="108" height="64" rx="12" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="18" y="26" width="72" height="12" rx="6" fill="#64748b" />

    <!-- Cell 2 -->
    <rect x="124" y="0" width="112" height="64" rx="12" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="142" y="26" width="76" height="12" rx="6" fill="#64748b" />

    <!-- Cell 3 -->
    <rect x="252" y="0" width="108" height="64" rx="12" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="270" y="26" width="72" height="12" rx="6" fill="#64748b" />
  </g>

  <!-- Row 3 Cells -->
  <g transform="translate(76, 390)">
    <!-- Cell 1 -->
    <rect x="0" y="0" width="108" height="48" rx="10" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="18" y="18" width="72" height="12" rx="6" fill="#475569" />

    <!-- Cell 2 -->
    <rect x="124" y="0" width="112" height="48" rx="10" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="142" y="18" width="76" height="12" rx="6" fill="#475569" />

    <!-- Cell 3 -->
    <rect x="252" y="0" width="108" height="48" rx="10" fill="url(#cellGrad)" stroke="#334155" stroke-width="3" />
    <rect x="270" y="18" width="72" height="12" rx="6" fill="#475569" />
  </g>
</svg>
